<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IoT Backup Vault{% endblock %}</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        vault: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#020617'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-sky-600 selection:text-white">

    <!-- Top Navigation Header -->
    <header class="bg-slate-900/95 backdrop-blur-md sticky top-0 z-40 border-b border-slate-800 px-4 lg:px-8 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            
            <!-- Brand -->
            <div class="flex items-center gap-3 cursor-pointer" onclick="switchTab('dashboard')">
                <div class="w-9 h-9 rounded-lg bg-sky-600 flex items-center justify-center text-white shadow-sm">
                    <i class="fa-solid fa-vault text-base"></i>
                </div>
                <div>
                    <span class="font-bold text-base tracking-tight text-white flex items-center gap-2">
                        IoT Backup Vault
                        <span class="text-[10px] font-mono text-emerald-400 bg-emerald-950/80 border border-emerald-800/80 px-1.5 py-0.5 rounded font-medium">Online</span>
                    </span>
                    <p class="text-[11px] text-slate-400">Secure Sensor Telemetry & Recovery</p>
                </div>
            </div>

            <!-- System Indicators -->
            <div class="hidden md:flex items-center gap-2.5 text-xs text-slate-400">
                <span class="flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-slate-800/60 border border-slate-700/60">
                    <i class="fa-solid fa-code-branch text-emerald-400 text-[11px]"></i> Versioning Active
                </span>
                <span class="flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-slate-800/60 border border-slate-700/60">
                    <i class="fa-solid fa-shield-halved text-sky-400 text-[11px]"></i> Encrypted Vault
                </span>
                <span class="flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-slate-800/60 border border-slate-700/60">
                    <i class="fa-solid fa-lock text-slate-300 text-[11px]"></i> Private Access
                </span>
            </div>

            <!-- Role Selector & Trigger -->
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-2 bg-slate-800/90 border border-slate-700 rounded-lg px-2.5 py-1">
                    <span class="text-xs text-slate-400 hidden sm:inline">Role:</span>
                    <select id="roleSelector" onchange="switchRole(this.value)" class="bg-slate-900 text-xs font-medium text-slate-200 border-0 rounded px-2 py-1 focus:outline-none focus:ring-1 focus:ring-sky-500 cursor-pointer">
                        {% for r in all_roles %}
                        <option value="{{ r }}" {% if r == active_role %}selected{% endif %}>
                            {% if r == 'BackupAdmin' %}Admin (Full Control)
                            {% elif r == 'SensorDevice' %}Sensor Node (Write-Only)
                            {% elif r == 'Auditor' %}Auditor (Read-Only)
                            {% else %}Guest (Restricted)
                            {% endif %}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <button onclick="triggerDailyBackup()" class="bg-sky-600 hover:bg-sky-500 text-white text-xs font-semibold px-3 py-2 rounded-lg shadow-sm flex items-center gap-1.5 active:scale-95 transition-all">
                    <i class="fa-solid fa-cloud-arrow-up text-xs"></i>
                    <span class="hidden sm:inline">Create Backup</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Unified Single-Page Navigation Tabs -->
    <nav class="bg-slate-900/60 border-b border-slate-800/80 px-4 lg:px-8 sticky top-[61px] z-30 backdrop-blur-md">
        <div class="max-w-7xl mx-auto flex items-center gap-1 overflow-x-auto py-2 text-xs font-medium scrollbar-thin">
            <button onclick="switchTab('dashboard')" id="btn-tab-dashboard" class="tab-btn px-3 py-1.5 rounded-md text-slate-300 hover:text-white hover:bg-slate-800/80 flex items-center gap-1.5 whitespace-nowrap transition-colors bg-sky-500/10 text-sky-400 border border-sky-500/30 font-semibold">
                <i class="fa-solid fa-chart-line text-[11px]"></i> Dashboard
            </button>
            <button onclick="switchTab('backups')" id="btn-tab-backups" class="tab-btn px-3 py-1.5 rounded-md text-slate-300 hover:text-white hover:bg-slate-800/80 flex items-center gap-1.5 whitespace-nowrap transition-colors">
                <i class="fa-solid fa-folder-closed text-[11px]"></i> Backup Catalog & Versions
            </button>
            <button onclick="switchTab('telemetry')" id="btn-tab-telemetry" class="tab-btn px-3 py-1.5 rounded-md text-slate-300 hover:text-white hover:bg-slate-800/80 flex items-center gap-1.5 whitespace-nowrap transition-colors">
                <i class="fa-solid fa-satellite-dish text-[11px]"></i> Live Telemetry
            </button>
            <button onclick="switchTab('iam')" id="btn-tab-iam" class="tab-btn px-3 py-1.5 rounded-md text-slate-300 hover:text-white hover:bg-slate-800/80 flex items-center gap-1.5 whitespace-nowrap transition-colors">
                <i class="fa-solid fa-user-lock text-[11px]"></i> Access Control
            </button>
            <button onclick="switchTab('lifecycle')" id="btn-tab-lifecycle" class="tab-btn px-3 py-1.5 rounded-md text-slate-300 hover:text-white hover:bg-slate-800/80 flex items-center gap-1.5 whitespace-nowrap transition-colors">
                <i class="fa-solid fa-layer-group text-[11px]"></i> Retention & Tiers
            </button>
            <button onclick="switchTab('audit')" id="btn-tab-audit" class="tab-btn px-3 py-1.5 rounded-md text-slate-300 hover:text-white hover:bg-slate-800/80 flex items-center gap-1.5 whitespace-nowrap transition-colors">
                <i class="fa-solid fa-clipboard-list text-[11px]"></i> Audit Logs
            </button>
            <button onclick="switchTab('docs')" id="btn-tab-docs" class="tab-btn px-3 py-1.5 rounded-md text-slate-300 hover:text-white hover:bg-slate-800/80 flex items-center gap-1.5 whitespace-nowrap transition-colors ml-auto">
                <i class="fa-solid fa-file-lines text-[11px]"></i> Documentation
            </button>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Global Toast Alert -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl border max-w-md"></div>

    <!-- Clean Footer -->
    <footer class="bg-slate-900/80 border-t border-slate-800/80 py-4 px-4 text-xs text-slate-400">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                <span>IoT Backup Vault &bull; Systems Operational</span>
            </div>
            <div>
                <span>&copy; {{ current_year }} IoT Backup Vault. All rights reserved.</span>
            </div>
        </div>
    </footer>

    <!-- Shared Application JS -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
